<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TouchGrass - Micro Adventure</title>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0f172a;
            --surface: #1e293b;
            --surface-2: #334155;
            --line: #475569;
            --text: #f8fafc;
            --muted: #94a3b8;
            --accent: #22c55e; 
            --accent-soft: rgba(34, 197, 94, 0.15);
            --font-display: 'Bricolage Grotesque', sans-serif;
            --font-body: 'IBM Plex Sans', sans-serif;
        }

        body {
            font-family: var(--font-body);
            background-color: var(--bg);
            background-image: radial-gradient(rgba(255,255,255,.03) 1px, transparent 1px);
            background-size: 20px 20px;
            color: var(--text);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 500px;
        }

        h1 {
            font-family: var(--font-display);
            font-weight: 800;
            font-size: 2.5rem;
            text-align: center;
            color: #fff;
            margin-bottom: 5px;
        }

        p.subtitle {
            text-align: center;
            color: var(--muted);
            margin-bottom: 30px;
            font-size: 15px;
        }

        .controls {
            background: var(--surface);
            padding: 24px;
            border-radius: 16px;
            border: 1px solid var(--line);
            margin-bottom: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-bottom: 20px;
        }

        label {
            font-weight: 600;
            font-size: 14px;
            color: var(--muted);
            margin-bottom: 6px;
            display: block;
        }

        select {
            width: 100%;
            padding: 14px;
            border-radius: 10px;
            border: 1px solid var(--line);
            background: var(--surface-2);
            color: #fff;
            font-family: var(--font-body);
            font-size: 16px;
            cursor: pointer;
        }

            select:focus {
                outline: 2px solid var(--accent);
            }

        button {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 10px;
            background-color: var(--accent);
            color: #000;
            font-weight: 700;
            font-family: var(--font-body);
            font-size: 16px;
            cursor: pointer;
            transition: 0.2s;
        }

            button:hover {
                background-color: #16a34a;
                transform: translateY(-2px);
            }

            button:active {
                transform: translateY(0);
            }

            button:disabled {
                opacity: 0.5;
                cursor: wait;
            }

        #loading {
            display: none;
            text-align: center;
            color: var(--accent);
            margin-top: 15px;
            font-weight: 600;
            font-size: 14px;
        }

        .adventure-card {
            background: var(--surface);
            border-top: 4px solid var(--accent);
            border-radius: 16px;
            padding: 24px;
            margin-top: 20px;
            display: none;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

            .adventure-card h2 {
                font-family: var(--font-display);
                margin-top: 0;
                margin-bottom: 20px;
                color: #fff;
            }

        .quest-item {
            display: flex;
            align-items: flex-start;
            gap: 14px;
            margin-bottom: 12px;
            padding: 16px;
            background: var(--surface-2);
            border: 1px solid var(--line);
            border-radius: 12px;
            transition: 0.2s;
        }

            .quest-item.done {
                opacity: 0.5;
                background: var(--accent-soft);
                border-color: var(--accent);
            }

                .quest-item.done .quest-text {
                    text-decoration: line-through;
                }

        input[type="checkbox"] {
            width: 22px;
            height: 22px;
            accent-color: var(--accent);
            cursor: pointer;
            margin-top: 2px;
            flex-shrink: 0;
        }

        .quest-text {
            font-size: 16px;
            line-height: 1.5;
            color: #fff;
            cursor: pointer;
        }

        .category {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--accent);
            font-weight: 700;
            margin-bottom: 4px;
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌲 TouchGrass</h1>
        <p class="subtitle">AI-powered offline micro-adventures. Minimize screen time, maximize real life.</p>

        <div class="controls">
            <div class="input-group">
                <div>
                    <label for="env">Where are you right now?</label>
                    <select id="env">
                        <option value="City Center">City Center</option>
                        <option value="Neighborhood">Neighborhood</option>
                        <option value="Local Park">Local Park / Nature</option>
                        <option value="Playground">Playground</option>
                        <option value="Shopping Mall">Shopping Mall</option>
                    </select>
                </div>
                <div>
                    <label for="time">How much time do you have?</label>
                    <select id="time">
                        <option value="15">15 minutes</option>
                        <option value="30">30 minutes</option>
                        <option value="60">1 hour</option>
                    </select>
                </div>
            </div>
            <button id="generateBtn" onclick="generateAdventure()">Generate Offline Quests</button>
            <div id="loading">Consulting local Gemma model...</div>
        </div>

        <div id="adventureContainer" class="adventure-card">
            <h2 id="advTitle">Your Adventure</h2>
            <div id="questsList"></div>
        </div>
    </div>

    <script>
        // API endpoint for generating adventures
        const API_URL = 'http://localhost:5285/api/generate-adventure';

        async function generateAdventure() {
            const env = document.getElementById('env').value;
            const time = parseInt(document.getElementById('time').value);
            const btn = document.getElementById('generateBtn');
            const loading = document.getElementById('loading');
            const container = document.getElementById('adventureContainer');
            const questsList = document.getElementById('questsList');

            btn.disabled = true;
            loading.style.display = 'block';
            container.style.display = 'none';
            questsList.innerHTML = '';

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ environment: env, durationMinutes: time })
                });

                if (!response.ok) throw new Error('Server error');

                const data = await response.json();

                document.getElementById('advTitle').innerText = data.title || "Your Offline Quest";

                if (data.quests && Array.isArray(data.quests)) {
                    data.quests.forEach((q, index) => {
                        const div = document.createElement('div');
                        div.className = 'quest-item';
                        div.innerHTML = `
                            <input type="checkbox" id="quest_${index}" onchange="toggleQuest(this)">
                            <div>
                                <span class="category">${escapeHTML(q.category || 'Task')}</span>
                                <label for="quest_${index}" class="quest-text">${escapeHTML(q.task)}</label>
                            </div>
                        `;
                        questsList.appendChild(div);
                    });
                } else {
                    throw new Error('Invalid schema from AI');
                }

                container.style.display = 'block';

            } catch (error) {
                console.error(error);
                alert('Помилка: Перевір у консолі, чи збігається порт (http://localhost:PORT) у файлі index.html із тим, що видає .NET.');
            } finally {
                btn.disabled = false;
                loading.style.display = 'none';
            }
        }

        function toggleQuest(checkbox) {
            if (checkbox.checked) {
                checkbox.parentElement.classList.add('done');
            } else {
                checkbox.parentElement.classList.remove('done');
            }
        }

        function escapeHTML(str) {
            if (!str) return '';
            return str.replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }
    </script>
</body>
</html>
